server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: pashumandi-milk-service
  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  # Shared symmetric signing secret with PashuMandi Auth Service
  secret: ${JWT_SECRET:dGVzdF9zZWNyZXRfa2V5X2Zvcl9wYXNodW1hbmRpX2F1dGhlbnRpY2F0aW9uX3N5c3RlbV8yNTZiaXRzIQ==}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes (in milliseconds)

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    urls:
      - name: "2. Milk Marketplace Service (Port 8081)"
        url: "/v3/api-docs"
      - name: "1. Core Platform & Livestock Service (Port 8080)"
        url: "http://localhost:8080/v3/api-docs"
