server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: pashumandi-backend
  profiles:
    default: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 55MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:xtg7v6vt}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  secret: ${JWT_SECRET:dGVzdF9zZWNyZXRfa2V5X2Zvcl9wYXNodW1hbmRpX2F1dGhlbnRpY2F0aW9uX3N5c3RlbV8yNTZiaXRzIQ==}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}       # 15 minutes (in milliseconds)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days (in milliseconds)

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  image-upload:
    max-file-size: 5242880 # 5 MB in bytes
    max-files-per-animal: 10
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
