spring:
  datasource:
    url: ${DEV_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/pashumandi?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
    username: ${DEV_DB_USERNAME:${DB_USERNAME:root}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD:Anil@gupta63}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: PashuMandi-Dev-HikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.pashumandi: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
